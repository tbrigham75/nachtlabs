[project]
name = "nachtlabs-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["nachtlabs-core"]
[tool.uv.sources]
nachtlabs-core = { workspace = true }
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/nachtlabs_worker"]

