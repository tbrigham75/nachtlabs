# Replace host/certificate paths. Install only after reviewing your TLS configuration.
server {
 listen 80;
 server_name nachtlabs.example.invalid;
 return 308 https://$host$request_uri;
}
server {
 listen 443 ssl;
 server_name nachtlabs.example.invalid;
 ssl_certificate /etc/ssl/nachtlabs/fullchain.pem;
 ssl_certificate_key /etc/ssl/nachtlabs/privkey.pem;
 client_max_body_size 128k;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 # Disable URL access logging for identity endpoints; application logs contain route templates only.
 access_log off;
 location /api/ {
  proxy_pass http://127.0.0.1:8000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_read_timeout 90s;
 }
 location / {
  proxy_pass http://127.0.0.1:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
}
