# ADR 0007 (supersedes ADR 0006 tier 3): executor broker as a container.
#
# This file is an overlay on top of compose.yaml:
#
#   docker compose -f compose.yaml -f compose.executor.yaml up -d --build executor
#
# It is deliberately a separate file so that a plain `docker compose up` of the
# control plane does not accidentally change shape when the deployment lane
# ships its stack. It does not modify any existing service.
#
# Operator-mandated compensating controls (see ADR 0007):
#   1. Authenticated channel   -- NACHTLABS_EXECUTOR_CHANNEL_KEY_FILE, generated by
#                                 container-init.py into the config volume; worker.env
#                                 (signs) and executor.env (verifies) both carry it.
#                                 No plaintext credential leaves the volume.
#   2. Least-privilege identity -- user 9000:9000 (the `nachtlabs` user created in
#                                 Dockerfile.api), cap_drop ALL, no-new-privileges,
#                                 read-only root fs, bounded memory/cpus/pids.
#   3. Network segregation       -- no `ports:`, only the internal `backend` bridge,
#                                 no extra_hosts, no host networking.
#   4. Credential isolation      -- the HMAC key never enters the image; only the
#                                 config volume (0600 file) carries it.

services:
  executor:
    # Build target is explicit: the last stage of Dockerfile.api is `test`
    # (dev group, no postgresql-client). Building without a target would tag
    # the wrong artifact. tests/test_container_init.py asserts this.
    build:
      context: .
      dockerfile: Dockerfile.api
      target: final
    image: nachtlabs/executor:local
    container_name: nachtlabs-executor
    restart: unless-stopped
    # Broker command: the trusted loop. The per-job sandbox dispatch still
    # expects a host that can enforce it (see ADR 0007 "what is not solved").
    command:
      - python3
      - -m
      - nachtlabs.execution.broker
    user: "9000:9000"
    # Runtime switches are NOT in this block. with-env.sh sources the generated
    # executor.env after compose sets the container environment, so any
    # NACHTLABS_* key that also appears there is silently discarded. Only keys
    # absent from the generated file are listed here.
    environment:
      NACHTLABS_CONFIG_DIR: /etc/nachtlabs
      NACHTLABS_ENV_FILE: /etc/nachtlabs/executor.env
    # Read-only root filesystem. The broker writes nothing outside /var/lib and
    # /tmp in the trusted path; if a future change needs a writable directory
    # it should be added explicitly, not opened at the fs level.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # The image already creates /var/lib/nachtlabs for the control plane roles;
    # the executor's state lives under /var/lib/nachtlabs/executor at runtime
    # and is not required for the broker loop to start.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Bounded resources: the container-runtime counterpart of the native unit's
    # MemoryMax=1G / TasksMax=64.
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    # No `ports:` by design. The broker is a database-to-database trust
    # boundary: it speaks to postgres and is spoken to by nothing else.
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      # init runs container-init.py which writes executor.env and the channel
      # key. Condition is "completed" so a stale pre-init state cannot start
      # the broker without the key that signs/verifies the channel.
      init:
        condition: service_completed_successfully
    healthcheck:
      # The broker does not expose HTTP. Health = it can connect to postgres
      # with its scoped role and read the table it needs. A failure here means
      # either the row set is missing or the role is misgranted.
      test:
        - CMD
        - python3
        - -c
        - |
          import sys
          from nachtlabs.database import session
          from nachtlabs.models import ExecutorJob
          with session() as s:
              s.execute(ExecutorJob.__table__.select().limit(1))
              sys.exit(0)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
