[project]
name = "nachtlabs-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["nachtlabs-core", "fastapi>=0.121,<1", "uvicorn[standard]>=0.34,<1", "alembic>=1.15,<2"]
[tool.uv.sources]
nachtlabs-core = { workspace = true }
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/nachtlabs_api"]

