[project]
name = "nachtlabs-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy>=2.0.38,<2.1", "psycopg[binary]>=3.2,<4",
  "pydantic[email]>=2.10,<3", "pydantic-settings>=2.8,<3",
  "argon2-cffi>=23.1,<26", "cryptography>=44,<47", "pyotp>=2.9,<3",
]
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/nachtlabs"]

